<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Momentum League</title>
  <desc id="description">A football matchday product where fixtures become fan rooms, predictions, standings, and a penalty-shootout game.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2b20" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="70%" cy="48%" r="62%">
      <stop offset="0" stop-color="#b9f23a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#b9f23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16251a"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#09110d"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity=".42"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g fill="#eaf0dd" font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="82" fill="#b9f23a" font-family="Consolas, monospace" font-size="17" letter-spacing="2">MOMENTUM LEAGUE</text>
    <text x="64" y="190" font-size="77" font-weight="700" letter-spacing="-3">Matchday,</text>
    <text x="64" y="278" font-size="77" font-weight="700" letter-spacing="-3">made playable.</text>
    <text x="66" y="336" fill="#aeb9a8" font-size="23">One fixture. A room full of ways to play.</text>
    <text x="66" y="374" fill="#aeb9a8" font-size="23">Predict, compete, then take the penalty.</text>
  </g>

  <g transform="translate(64 452)">
    <rect width="438" height="134" rx="8" fill="#101b13" stroke="#30422a"/>
    <text x="24" y="35" fill="#b9f23a" font-family="Consolas, monospace" font-size="14" letter-spacing="1.5">MATCHDAY ROOM</text>
    <path d="M24 52H414" stroke="#30422a"/>
    <text x="24" y="84" fill="#eaf0dd" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Fixtures</text>
    <text x="153" y="84" fill="#aeb9a8" font-family="Arial, Helvetica, sans-serif" font-size="17">Rooms</text>
    <text x="244" y="84" fill="#aeb9a8" font-family="Arial, Helvetica, sans-serif" font-size="17">Predictions</text>
    <text x="24" y="113" fill="#aeb9a8" font-family="Arial, Helvetica, sans-serif" font-size="17">and a penalty shootout built for the fans.</text>
  </g>

  <g transform="translate(588 56)">
    <rect x="0" y="0" width="548" height="563" rx="10" fill="#0c1710" stroke="#2b3d2e"/>
    <text x="28" y="40" fill="#b9f23a" font-family="Consolas, monospace" font-size="14" letter-spacing="1.5">THE PENALTY BREAK</text>
    <text x="28" y="68" fill="#aeb9a8" font-family="Arial, Helvetica, sans-serif" font-size="16">Match context turns into a moment to play.</text>
    <g transform="translate(33 97)">
      <rect x="0" y="0" width="482" height="420" rx="5" fill="url(#pitch)" stroke="#4d6643" stroke-width="2"/>
      <path d="M0 210H482M241 0V420" stroke="#3a5237" stroke-width="2"/>
      <circle cx="241" cy="210" r="67" fill="none" stroke="#3a5237" stroke-width="2"/>
      <rect x="118" y="0" width="246" height="68" fill="none" stroke="#3a5237" stroke-width="2"/>
      <rect x="118" y="352" width="246" height="68" fill="none" stroke="#3a5237" stroke-width="2"/>
      <path d="M167 0V42H315V0M196 0V18H286V0" fill="none" stroke="#b9f23a" stroke-width="4"/>
      <path d="M241 327C248 270 285 232 305 201C326 170 328 130 315 91" fill="none" stroke="#b9f23a" stroke-width="3" stroke-dasharray="7 9" opacity=".8"/>
      <circle cx="241" cy="327" r="13" fill="#eaf0dd"/>
      <path d="M241 315L251 321L247 333H235L231 321Z" fill="#273329"/>
      <circle cx="315" cy="90" r="14" fill="#b9f23a"/>
      <circle cx="315" cy="90" r="5" fill="#09110d"/>
      <circle cx="315" cy="90" r="28" fill="none" stroke="#b9f23a" stroke-opacity=".35" stroke-width="2"/>
      <path d="M0 352H118M364 352H482" stroke="#3a5237" stroke-width="2"/>
      <circle cx="241" cy="210" r="4" fill="#b9f23a"/>
    </g>
    <text x="33" y="546" fill="#aeb9a8" font-family="Consolas, monospace" font-size="13" letter-spacing="1.2">FIXTURES / ROOMS / PREDICTIONS / PENALTIES</text>
  </g>
</svg>
